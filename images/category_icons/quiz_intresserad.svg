<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 2. Fågelintresserad: En söt ungunge som kikar ut ur det kläckta ägget -->
  <g fill="#2E5D4B">
    <!-- Chick Head (Centered and perfectly round) -->
    <circle cx="50" cy="40" r="16" />
    
    <!-- Symmetrical Beak pointing down -->
    <polygon points="45,42 55,42 50,50" />
    
    <!-- Symmetrical White Eyes -->
    <circle cx="43" cy="36" r="2.5" fill="#ffffff" />
    <circle cx="57" cy="36" r="2.5" fill="#ffffff" />
    
    <!-- Symmetrical Head Tuft -->
    <path d="M 50,24 C 47,18 50,14 50,14 C 50,14 53,18 50,24 Z" />

    <!-- Egg Shell Bottom -->
    <path d="M 22 56 C 22 74 34 84 50 84 C 66 84 78 74 78 56 L 68 62 L 58 52 L 50 60 L 42 52 L 32 62 Z" />
  </g>
</svg>

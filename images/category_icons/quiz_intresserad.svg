<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Binoculars with bird / Fågelintresserad -->
  <g fill="#2E5D4B">
    <!-- Bird perched on top -->
    <path d="M 50 12 C 55 12 59 16 59 20 C 59 23 57 26 54 28 C 63 32 68 40 68 40 L 48 40 C 44 40 40 37 38 33 C 34 35 28 35 24 33 L 34 26 C 36 21 42 12 50 12 Z"/>
    <!-- Bird beak & eye -->
    <polygon points="59,18 67,20 59,22" fill="#2E5D4B"/>
    <circle cx="53" cy="18" r="2" fill="#ffffff"/>

    <!-- Binocular Left Lens Cylinder -->
    <rect x="22" y="46" width="22" height="36" rx="4" fill="#2E5D4B"/>
    <rect x="20" y="78" width="26" height="8" rx="3" fill="#2E5D4B"/>
    <rect x="25" y="42" width="16" height="6" rx="2" fill="#2E5D4B"/>

    <!-- Binocular Right Lens Cylinder -->
    <rect x="56" y="46" width="22" height="36" rx="4" fill="#2E5D4B"/>
    <rect x="54" y="78" width="26" height="8" rx="3" fill="#2E5D4B"/>
    <rect x="59" y="42" width="16" height="6" rx="2" fill="#2E5D4B"/>

    <!-- Center Bridge & Focus Knob -->
    <rect x="44" y="52" width="12" height="20" rx="2" fill="#2E5D4B"/>
    <circle cx="50" cy="50" r="5" fill="#2E5D4B"/>

    <!-- Lens highlights (white lines) -->
    <path d="M 26 52 L 26 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 60 52 L 60 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>

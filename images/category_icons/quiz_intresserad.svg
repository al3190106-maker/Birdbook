<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 2. Fågelintresserad: En ungunge som kikar ut ur det kläckta ägget -->
  <g fill="#2E5D4B">
    <!-- Chick Head in the middle -->
    <circle cx="50" cy="42" r="16" />
    <!-- Open beak pointing right -->
    <polygon points="62,38 72,42 62,46" />
    <!-- Eye cutout -->
    <circle cx="54" cy="38" r="2.5" fill="#ffffff" />
    <!-- Head Tuft -->
    <path d="M 48,26 C 46,20 49,16 51,14 C 52,18 50,22 48,26 Z" />
    
    <!-- Egg Shell Bottom -->
    <path d="M 20 54 C 20 74 32 86 50 86 C 68 86 80 74 80 54 L 70 46 L 60 54 L 50 44 L 40 54 L 30 46 Z" />
    
    <!-- Egg Shell Top (tilted and shifted up) -->
    <path d="M 50 6 C 35 6 24 24 24 38 L 34 32 L 44 40 L 52 30 L 62 38 L 72 30 L 78 36 C 76 22 65 6 50 6 Z" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 2. Fågelintresserad: En ungunge som kikar ut ur det kläckta ägget -->
  <g fill="#2E5D4B">
    <!-- Chick Head & Beak emerging -->
    <circle cx="50" cy="38" r="18" />
    <!-- Beak pointing up-right -->
    <polygon points="58,34 72,38 58,42" />
    <!-- White Eye cutout -->
    <circle cx="54" cy="33" r="3" fill="#ffffff" />
    <!-- Head Tuft -->
    <path d="M 47 20 C 46 14 49 11 51 9 C 52 14 50 17 48 20 Z" />

    <!-- Bottom cracked Eggshell -->
    <path d="M 20 54 L 32 46 L 42 56 L 50 46 L 58 56 L 68 46 L 80 54 C 80 74 68 86 50 86 C 32 86 20 74 20 54 Z" />
  </g>
</svg>

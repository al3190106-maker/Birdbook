<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 2. Fågelintresserad: Fågel i ett ägg -->
  <g fill="#2E5D4B">
    <!-- Egg shell bottom -->
    <path d="M 22 56 C 22 74 34 84 50 84 C 66 84 78 74 78 56 L 68 62 L 58 52 L 50 60 L 42 52 L 32 62 Z" />
    
    <!-- Bird inside egg -->
    <path d="M 50 22 C 43 22 36 26 34 34 C 33 42 36 48 40 54 L 60 54 C 64 48 67 42 66 34 C 64 26 57 22 50 22 Z" />
    <!-- Beak -->
    <polygon points="58,30 68,34 58,38" />
    <!-- White Eye -->
    <circle cx="52" cy="30" r="2.5" fill="#ffffff" />
    <!-- Curved wing line (white cutout) -->
    <path d="M 44 42 Q 40 48 46 52" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

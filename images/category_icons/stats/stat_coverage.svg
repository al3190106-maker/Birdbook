<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#e0e7ff" stroke-width="16" />
  <!-- Bold active progress arc (75%) -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#4f46e5" stroke-width="16"
          stroke-dasharray="226.19" stroke-dashoffset="56.55" stroke-linecap="round"
          transform="rotate(-90 50 50)" />
  <!-- Center % symbol in bold solid indigo -->
  <g fill="#4f46e5">
    <circle cx="40" cy="39" r="6" />
    <circle cx="60" cy="61" r="6" />
    <line x1="63" y1="35" x2="37" y2="65" stroke="#4f46e5" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 4. Fågelorakel: Fågeln är nu förälder och matar sina ungar i boet -->
  <g fill="#2E5D4B">
    <!-- Nest (bottom) -->
    <path d="M 16 66 C 16 82 32 88 50 88 C 68 88 84 82 84 66 C 72 70 60 72 50 72 C 40 72 28 70 16 66 Z" />
    <path d="M 12 70 Q 50 78 88 70 Q 50 94 12 70 Z" />

    <!-- Nestling 1 (left chick looking up) -->
    <path d="M 28 58 C 24 58 20 62 20 68 L 36 68 C 36 62 32 58 28 58 Z" />
    <polygon points="28,52 24,58 32,58" />
    <circle cx="25" cy="62" r="1.5" fill="#ffffff" />

    <!-- Nestling 2 (center chick looking up to parent) -->
    <path d="M 42 54 C 38 54 34 58 34 66 L 50 66 C 50 58 46 54 42 54 Z" />
    <polygon points="42,46 37,54 47,54" />
    <circle cx="39" cy="58" r="1.5" fill="#ffffff" />

    <!-- Adult Parent Bird (right, leaning over to feed chicks) -->
    <path d="M 72 24 C 64 24 58 30 58 42 C 58 54 64 68 76 68 C 84 68 88 60 88 48 C 88 34 82 24 72 24 Z" />
    <!-- Parent head crest (same species crest) -->
    <path d="M 70 24 C 68 18 71 15 73 13 C 74 17 72 20 71 23 Z" fill="#2E5D4B" />
    <path d="M 73 25 C 75 20 78 18 80 16 C 79 20 76 23 74 25 Z" fill="#2E5D4B" />

    <!-- Parent Beak feeding down into chick's beak -->
    <polygon points="62,38 48,46 60,42" fill="#2E5D4B" />
    <!-- Worm/Food held in beak -->
    <path d="M 52 44 Q 46 48 42 50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Parent Eye cutout (white) -->
    <circle cx="68" cy="32" r="2.5" fill="#ffffff" />
    
    <!-- Parent Wing detail cutout -->
    <path d="M 74 44 Q 82 50 84 62" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

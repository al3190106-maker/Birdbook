<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 4. Fågelorakel: Fågel matar liten fågel -->
  <g fill="#2E5D4B">
    <!-- Nest bowl at the bottom-left -->
    <path d="M 12 60 C 12 76, 26 84, 46 84 C 58 84, 68 80, 70 72 M 10 62 L 72 62" fill="none" stroke="#2E5D4B" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 16 68 Q 42 74, 68 68" fill="none" stroke="#2E5D4B" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Nestling baby chick on left -->
    <path d="M 28 48 C 22 48, 16 52, 16 60 L 38 60 C 38 52, 34 48, 28 48 Z" />
    <polygon points="26,44 18,36 28,42" />
    <circle cx="24" cy="52" r="1.5" fill="#ffffff" />

    <!-- Parent bird perched on the right branch/edge -->
    <path d="M 72 26 C 72 19, 63 15, 54 19 C 45 23, 38 32, 34 46 C 36 44, 40 44, 44 44 C 54 44, 64 42, 70 36 C 76 30, 74 28, 72 26 Z" />
    <!-- Parent beak pointing down-left -->
    <polygon points="56,22 42,28 54,28" />
    <!-- Parent eye -->
    <circle cx="62" cy="24" r="2.5" fill="#ffffff" />
    <!-- Parent wing line -->
    <path d="M 52 34 Q 46 42, 54 50" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Worm connecting beaks -->
    <path d="M 44 29 Q 34 32, 24 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

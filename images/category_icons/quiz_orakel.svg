<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 4. Fågelorakel: Symmetrisk familj (förälder matar sina ungar) -->
  <g fill="#2E5D4B">
    <!-- Nest bowl at the bottom -->
    <path d="M 20 62 C 20 80, 80 80, 80 62 Z" />
    <path d="M 20 62 Q 50 68 80 62" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Chick 1 (Left) -->
    <circle cx="36" cy="52" r="10" />
    <polygon points="32,44 40,44 36,50" />
    <circle cx="31" cy="38" r="1" fill="#ffffff" />
    <circle cx="31" cy="50" r="1.5" fill="#ffffff" />
    <circle cx="41" cy="50" r="1.5" fill="#ffffff" />

    <!-- Chick 2 (Right) -->
    <circle cx="64" cy="52" r="10" />
    <polygon points="60,44 68,44 64,50" />
    <circle cx="59" cy="50" r="1.5" fill="#ffffff" />
    <circle cx="69" cy="50" r="1.5" fill="#ffffff" />

    <!-- Parent Bird hovering/leaning in the center top -->
    <path d="M 50 18 C 42 18, 36 24, 36 34 C 36 44, 44 48, 50 48 C 56 48, 64 44, 64 34 C 64 24, 58 18, 50 18 Z" />
    <!-- Parent Beak pointing down -->
    <polygon points="46,44 54,44 50,54" />
    <!-- Parent Eyes -->
    <circle cx="44" cy="32" r="2.5" fill="#ffffff" />
    <circle cx="56" cy="32" r="2.5" fill="#ffffff" />
    <!-- Parent Head Tuft -->
    <path d="M 50,22 C 47,16 50,12 50,12 C 50,12 53,16 50,22 Z" />

    <!-- Worm connecting beak to nest -->
    <path d="M 50 54 Q 50 60 44 58 Q 38 56 36 52" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Owl Oracle / Fågelorakel -->
  <g fill="#2E5D4B">
    <!-- Crescent Moon behind -->
    <path d="M 70 12 C 60 12 52 20 52 30 C 52 40 60 48 70 48 C 65 48 58 42 58 30 C 58 18 65 12 70 12 Z" />
    
    <!-- Little Stars -->
    <polygon points="25,18 27,22 31,22 28,25 29,29 25,27 21,29 22,25 19,22 23,22" />
    <polygon points="80,24 81,27 84,27 82,29 83,32 80,30 77,32 78,29 76,27 79,27" />

    <!-- Owl Body -->
    <path d="M 50 22 C 34 22 28 34 28 54 C 28 72 38 84 50 84 C 62 84 72 72 72 54 C 72 34 66 22 50 22 Z" />
    
    <!-- Ear tufts -->
    <polygon points="34,26 28,14 40,24" />
    <polygon points="66,26 72,14 60,24" />

    <!-- Large Owl Eye Cutouts (white) -->
    <circle cx="41" cy="42" r="10" fill="#ffffff" />
    <circle cx="59" cy="42" r="10" fill="#ffffff" />
    
    <!-- Pupils -->
    <circle cx="41" cy="42" r="5" fill="#2E5D4B" />
    <circle cx="59" cy="42" r="5" fill="#2E5D4B" />
    <circle cx="43" cy="40" r="1.5" fill="#ffffff" />
    <circle cx="61" cy="40" r="1.5" fill="#ffffff" />

    <!-- Beak -->
    <polygon points="50,44 46,54 54,54" fill="#2E5D4B" />

    <!-- Feather chest markings (white lines) -->
    <path d="M 44 64 Q 50 68 56 64" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M 42 72 Q 50 76 58 72" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Branch -->
    <path d="M 20 84 Q 50 88 80 84" fill="none" stroke="#2E5D4B" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>

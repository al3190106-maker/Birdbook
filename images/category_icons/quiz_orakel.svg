<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 4. Fågelorakel: Enkel och tydlig matning i boet -->
  <g fill="#2E5D4B">
    <!-- Nest bowl -->
    <path d="M 20 62 C 20 80, 80 80, 80 62 Z" />
    
    <!-- Baby chick head inside nest -->
    <circle cx="38" cy="52" r="10" />
    <!-- Baby open beak -->
    <polygon points="34,44 26,36 35,42" />
    <polygon points="36,47 28,43 36,44" />
    <!-- Baby eye -->
    <circle cx="34" cy="52" r="1.5" fill="#ffffff" />
    
    <!-- Parent bird body and head -->
    <!-- Parent head -->
    <circle cx="66" cy="38" r="12" />
    <!-- Parent body -->
    <path d="M 66 38 C 76 38, 82 46, 82 58 C 82 66, 76 72, 66 72 C 60 72, 56 66, 58 58 C 58 46, 60 38, 66 38 Z" />
    <!-- Parent beak pointing down to baby -->
    <polygon points="58,40 46,46 58,46" />
    <!-- Parent eye -->
    <circle cx="66" cy="36" r="2" fill="#ffffff" />
    
    <!-- Worm connecting beaks (white stroke) -->
    <path d="M 46 46 Q 38 43 30 42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

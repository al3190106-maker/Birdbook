<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 4. Fågelorakel: Föräldern matar sin ungunge i boet -->
  <g fill="#2E5D4B">
    <!-- Simple Nest at bottom -->
    <path d="M 14 66 C 14 84 30 88 50 88 C 70 88 86 84 86 66 Z" />
    <path d="M 14 66 Q 50 74 86 66" fill="none" stroke="#ffffff" stroke-width="3" />

    <!-- Baby Chick Head in nest (left) with open beak -->
    <circle cx="34" cy="54" r="11" />
    <polygon points="32,46 26,38 36,44" />
    <polygon points="34,49 28,45 36,46" />
    <circle cx="30" cy="53" r="2" fill="#ffffff" />

    <!-- Adult Parent Bird (right) leaning down to feed -->
    <path d="M 74 24 C 64 24 56 32 56 46 C 56 56 64 68 76 68 C 84 68 88 58 88 46 C 88 32 82 24 74 24 Z" />
    <circle cx="68" cy="32" r="2.5" fill="#ffffff" />
    <polygon points="64,38 46,44 62,44" fill="#2E5D4B" />

    <!-- Worm in beak connecting parent to chick -->
    <path d="M 50 44 Q 42 42 34 43" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

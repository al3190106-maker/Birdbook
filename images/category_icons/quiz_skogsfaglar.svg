<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Woodpecker & Forest / Skogsfåglar -->
  <g fill="#2E5D4B">
    <!-- Background Pine Trees (silhouettes) -->
    <polygon points="24,65 14,84 34,84" />
    <polygon points="24,52 17,67 31,67" />
    <polygon points="24,42 19,54 29,54" />

    <!-- Tree Trunk -->
    <rect x="58" y="12" width="12" height="74" rx="2" />
    <!-- Tree Bark Lines -->
    <path d="M 62 20 L 62 35 M 66 30 L 66 50 M 62 55 L 62 75 M 66 65 L 66 80" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Woodpecker Body clinging to trunk -->
    <path d="M 58 40 C 46 36 38 45 42 62 C 45 72 50 78 56 82 L 54 86 L 58 84 L 58 68 C 50 64 48 52 58 46 Z" />
    <!-- Head & Crest -->
    <path d="M 58 40 C 52 38 46 30 42 24 L 46 22 L 50 26 C 54 28 58 32 58 40 Z" />
    <!-- Sharp Beak pecking tree -->
    <polygon points="45,28 62,32 47,34" fill="#2E5D4B" />
    <!-- Eye cutout -->
    <circle cx="50" cy="30" r="1.5" fill="#ffffff" />
    <!-- Feet gripping trunk -->
    <path d="M 58 48 L 52 48 M 58 52 L 52 54 M 58 64 L 52 66" stroke="#2E5D4B" stroke-width="2" stroke-linecap="round" />

    <!-- Forest Ground -->
    <path d="M 10 84 H 90" stroke="#2E5D4B" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>

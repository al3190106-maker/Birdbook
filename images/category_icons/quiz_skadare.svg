<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 3. Fågelskådare: Fågel (Fågel på gren) -->
  <g fill="#2E5D4B">
    <!-- Bird -->
    <path d="M 75 25 C 75 18, 65 14, 55 18 C 45 22, 32 32, 22 48 C 18 54, 12 58, 6 60 C 14 62, 22 62, 26 58 C 34 50, 42 42, 52 42 C 65 42, 75 36, 75 25 Z" />
    <!-- Tail -->
    <path d="M 24 54 L 10 76 C 10 76, 14 78, 16 78 L 30 58 Z" />

    <polygon points="73,20 84,23 74,27" />
    <!-- Eye -->
    <circle cx="64" cy="22" r="2.5" fill="#ffffff" />
    <!-- Wing curved detail (white cutout) -->
    <path d="M 52 34 Q 44 42, 54 52" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Branch -->
    <path d="M 15 74 L 85 64" fill="none" stroke="#2E5D4B" stroke-width="3" stroke-linecap="round" />
    <!-- Legs -->
    <path d="M 44 50 L 40 68 M 52 48 L 50 66" fill="none" stroke="#2E5D4B" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

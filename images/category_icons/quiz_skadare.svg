<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Spotting Scope / Fågelskådare -->
  <g fill="#2E5D4B">
    <!-- Soaring eagle silhouette top right -->
    <path d="M 72 16 C 68 18 62 18 56 16 C 62 20 66 22 72 23 C 78 22 82 20 88 16 C 82 18 76 18 72 16 Z" />
    <path d="M 72 16 L 70 26 L 72 24 L 74 26 Z" />

    <!-- Scope main body -->
    <path d="M 18 36 L 54 26 L 58 36 L 20 44 Z" />
    <!-- Eyepiece (angled up) -->
    <path d="M 16 38 L 22 28 L 14 24 L 10 34 Z" />
    <!-- Objective lens cap/sunshade -->
    <path d="M 54 24 L 62 22 L 64 40 L 56 38 Z" />

    <!-- Tripod Mount & Pan Head -->
    <circle cx="36" cy="42" r="4" />
    <rect x="34" y="44" width="4" height="10" rx="1" />

    <!-- Tripod Legs -->
    <path d="M 36 52 L 18 90 H 22 L 36 56 L 50 90 H 54 L 36 52 Z" />
    <path d="M 36 54 L 36 90 H 39 L 39 54 Z" />
    
    <!-- Fine detail lines -->
    <line x1="22" y1="30" x2="16" y2="40" stroke="#ffffff" stroke-width="1.5" />
    <line x1="56" y1="25" x2="58" y2="37" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>

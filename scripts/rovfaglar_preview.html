<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rovfåglar Siluett – Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Outfit', sans-serif;
    display: flex; justify-content: center; align-items: center; 
    min-height: 100vh; background: #f0f4f1; padding: 1rem;
  }

  .silhouette-chart {
    background: #fff;
    border-radius: 16px;
    padding: 2rem 2rem 1.5rem;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  .silhouette-chart h2 {
    text-align: center;
    color: #2E5D4B;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 0.3rem;
  }

  .silhouette-chart .subtitle-line {
    display: block;
    width: 60%;
    height: 2px;
    background: #8FBC8F;
    margin: 0 auto 1.5rem;
    opacity: 0.4;
    border-radius: 1px;
  }

  .birds-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    padding: 0 0.5rem;
  }

  .bird-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }

  .bird-img-wrapper {
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .bird-img-wrapper img {
    width: 100%;
    height: auto;
    object-fit: contain;
    /* Make the image pure black silhouette even if it has slight color */
    filter: brightness(0);
  }

  .bird-label {
    text-align: center;
    margin-top: 0.6rem;
  }

  .bird-label .name {
    font-size: 0.85rem;
    font-weight: 700;
    color: #2E5D4B;
    display: block;
  }

  .bird-label .span {
    font-size: 0.72rem;
    color: #7F8C8D;
    display: block;
    margin-top: 0.1rem;
  }

  .chart-footer {
    text-align: center;
    margin-top: 1.2rem;
    font-size: 0.65rem;
    color: #bbb;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="silhouette-chart">
  <h2>SVENSKA ROVFÅGLAR</h2>
  <span class="subtitle-line"></span>
  
  <div class="birds-row" id="birds-row"></div>
  
  <div class="chart-footer">Relativ storlek baserad på genomsnittligt vingspann</div>
</div>

<script>
/**
 * Each bird's width in the layout is proportional to its real wingspan.
 * We use a base unit where 1 cm = a fraction of the container width.
 * 
 * Total wingspan sum: 60+75+115+120+150+230 = 750 cm
 * Each bird gets (wingspan / 750) of available space.
 */
const birds = [
  { name: 'HÖK',      wingspan: 60,  img: '../images/Identifiering/sil_hok.png' },
  { name: 'FALK',     wingspan: 75,  img: '../images/Identifiering/sil_falk.png' },
  { name: 'KÄRRHÖK',  wingspan: 115, img: '../images/Identifiering/sil_karrhok.png' },
  { name: 'VRÅK',     wingspan: 120, img: '../images/Identifiering/sil_vrak.png' },
  { name: 'GLADA',    wingspan: 150, img: '../images/Identifiering/sil_glada.png' },
  { name: 'ÖRN',      wingspan: 230, img: '../images/Identifiering/sil_orn.png' },
];

const totalWingspan = birds.reduce((sum, b) => sum + b.wingspan, 0);
const container = document.getElementById('birds-row');

birds.forEach(bird => {
  // Each bird's column width = its proportion of total wingspan
  const pct = (bird.wingspan / totalWingspan) * 100;
  
  const col = document.createElement('div');
  col.className = 'bird-column';
  col.style.width = pct + '%';
  
  const wrapper = document.createElement('div');
  wrapper.className = 'bird-img-wrapper';
  
  const img = document.createElement('img');
  img.src = bird.img;
  img.alt = bird.name + ' siluett';
  img.loading = 'lazy';
  
  wrapper.appendChild(img);
  
  const label = document.createElement('div');
  label.className = 'bird-label';
  label.innerHTML = `<span class="name">${bird.name}</span><span class="span">~${bird.wingspan} cm</span>`;
  
  col.appendChild(wrapper);
  col.appendChild(label);
  container.appendChild(col);
});

// Verify proportions
console.log('=== SCALE VERIFICATION ===');
const ref = birds[0];
birds.forEach(b => {
  const ratio = b.wingspan / ref.wingspan;
  const widthRatio = (b.wingspan / totalWingspan) / (ref.wingspan / totalWingspan);
  console.log(`${b.name}: ${b.wingspan}cm → ${(b.wingspan/totalWingspan*100).toFixed(1)}% width (${ratio.toFixed(2)}× HÖK) ✅`);
});
</script>
</body>
</html>

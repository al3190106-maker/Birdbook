  {
    name: 'FALK',
    wingspan: 75,
    // Long swept-back pointed wings, compact tail

      C -0.04,-0.20 -0.10,-0.16 -0.18,-0.10

      L 0.94,0.16

  {

    wingspan: 115,

      C -0.05,-0.22 -0.12,-0.16 -0.20,-0.10

      Q 1.00,-0.02 0.94,0.00
      C 0.76,0.02 0.40,-0.02 0.20,-0.10

  },
  {

    wingspan: 120,
    // Broad rounded wings, short fanned tail
    path: `M 0,-0.24

  {
    name: 'ÖRN',
    wingspan: 230,
    // Massive broad rectangular wings with finger feathers, short broad tail
    path: `M 0,-0.22
      C -0.06,-0.18 -0.16,-0.12 -0.26,-0.06
      C -0.46,0.02 -0.74,0.06 -0.86,0.04

      C 0.74,0.06 0.46,0.02 0.26,-0.06
      C 0.16,-0.12 0.06,-0.18 0,-0.22 Z`
  }
];

const PX_PER_CM = 1.3;
const GAP = 12;
const MARGIN = 20;
const TITLE_HEIGHT = 55;
const LABEL_AREA = 70;

// Calculate positions
let cursor = MARGIN;
const positions = BIRDS.map(b => {
  const w = b.wingspan * PX_PER_CM;
  const cx = cursor + w / 2;
  cursor += w + GAP;
  return { cx, width: w, scale: w / 2 };
});
const totalWidth = cursor - GAP + MARGIN;

// Find max bird height for vertical centering
const maxScale = Math.max(...positions.map(p => p.scale));
const birdAreaHeight = maxScale * 1.0; // rough vertical extent
const birdCenterY = TITLE_HEIGHT + birdAreaHeight * 0.55;
const svgHeight = TITLE_HEIGHT + birdAreaHeight + LABEL_AREA + 20;

// Build SVG
let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth.toFixed(0)} ${svgHeight.toFixed(0)}" 
  style="width:100%; max-width:${totalWidth.toFixed(0)}px; height:auto; font-family:'Outfit',sans-serif;">

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="0"/>

  <!-- Title -->
  <text x="${totalWidth/2}" y="${TITLE_HEIGHT - 15}" 
    text-anchor="middle" font-size="28" font-weight="700" 
    fill="#2E5D4B" letter-spacing="2">SVENSKA ROVFÅGLAR</text>
  <line x1="${totalWidth*0.2}" y1="${TITLE_HEIGHT - 5}" x2="${totalWidth*0.8}" y2="${TITLE_HEIGHT - 5}" 
    stroke="#8FBC8F" stroke-width="1.5" opacity="0.5"/>
`;

// Draw birds + labels
BIRDS.forEach((bird, i) => {
  const { cx, scale } = positions[i];
  
  // Bird silhouette
  svg += `
  <g transform="translate(${cx.toFixed(1)}, ${birdCenterY.toFixed(1)}) scale(${scale.toFixed(2)})">
    <path d="${bird.path}" fill="#1a1a1a"/>
  </g>`;
  
  // Label: name
  const labelY = birdCenterY + maxScale * 0.55 + 25;
  svg += `
  <text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" 
    text-anchor="middle" font-size="14" font-weight="700" fill="#2E5D4B">${bird.name}</text>`;
  
  // Label: wingspan
  svg += `
  <text x="${cx.toFixed(1)}" y="${(labelY + 18).toFixed(1)}" 
    text-anchor="middle" font-size="11" font-weight="400" fill="#7F8C8D">~${bird.wingspan} cm</text>`;
});

// Footer note
svg += `
  <text x="${totalWidth/2}" y="${svgHeight - 8}" 
    text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">
    Relativ storlek baserad på genomsnittligt vingspann
  </text>`;

svg += `\n</svg>`;

// Render
document.getElementById('preview').innerHTML = svg;

// Log analysis
console.log('=== SCALE VERIFICATION ===');
const refWidth = BIRDS[0].wingspan * PX_PER_CM;
BIRDS.forEach((b, i) => {
  const actual = b.wingspan * PX_PER_CM;
  const expected = (b.wingspan / BIRDS[0].wingspan) * refWidth;
  const ratio = actual / expected;
  console.log(`${b.name}: ${actual.toFixed(1)}px (expected ${expected.toFixed(1)}px) ratio=${ratio.toFixed(4)} ${Math.abs(ratio-1) < 0.001 ? '✅' : '❌'}`);
});
</script>
</body>
</html>
